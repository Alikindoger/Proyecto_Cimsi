bind 0.0.0.0
port 6379
protected-mode yes

# Contraseña de acceso (Pongo la misma contraseña que en las raspberry Pi)
requirepass cimsi2627

# Limite de memoria y politica de reemplazo lru(least-recently-used)
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistencia
save 60 100
dir /data

loglevel notice