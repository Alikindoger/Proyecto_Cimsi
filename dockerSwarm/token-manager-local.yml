version: "3.8"

services:
  token-manager:
    image: cimsi-token-manager:local
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: cimsi_game
      POSTGRES_USER: cimsi_user
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    secrets:
      - postgres_password
      - redis_password
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        export POSTGRES_PASSWORD="$$(cat /run/secrets/postgres_password)"
        export REDIS_PASSWORD="$$(cat /run/secrets/redis_password)"
        exec python /app/server.py
    networks:
      - cimsi_net
    deploy:
      replicas: 1

secrets:
  postgres_password:
    external: true
    name: cimsi_postgres_local_password
  redis_password:
    external: true
    name: cimsi_redis_local_password

networks:
  cimsi_net:
    external: true